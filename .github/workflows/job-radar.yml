name: Job Radar

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      baseline_only:
        description: "Silently record current listings (use after adding new ATS boards)"
        required: false
        type: boolean
        default: false
      test_telegram:
        description: "Send a Telegram test message only; do not scan jobs"
        required: false
        type: boolean
        default: false
      test_groq:
        description: "Test one Groq API request only; do not scan jobs"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      JOB_RADAR_PROFILE_JSON: ${{ secrets.JOB_RADAR_PROFILE_JSON }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BASELINE_ONLY: ${{ inputs.baseline_only }}
      TEST_TELEGRAM: ${{ inputs.test_telegram }}
      TEST_GROQ: ${{ inputs.test_groq }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Telegram delivery
        if: ${{ inputs.test_telegram == true }}
        run: python job_radar.py --test-telegram

      - name: Test Groq AI connection
        if: ${{ inputs.test_groq == true }}
        run: python job_radar.py --test-groq

      - name: Scan official ATS feeds
        if: ${{ inputs.test_telegram != true && inputs.test_groq != true }}
        run: |
          if [ "$BASELINE_ONLY" = "true" ]; then
            python job_radar.py --baseline-only
          else
            python job_radar.py
          fi

      - name: Save deduplication state
        if: ${{ inputs.test_telegram != true && inputs.test_groq != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update job radar state [skip ci]"
            git push
          else
            echo "No state changes to commit; existing deduplication state is unchanged."
          fi
